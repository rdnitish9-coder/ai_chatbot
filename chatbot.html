<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER_CORE // FIXED_UI</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

    body, html {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #020b05 !important;
    }

    .font-tech {
      font-family: 'Fira Code', monospace;
    }

    .pitch-glass {
      background: rgba(2, 11, 5, 0.85);
      border: 1px solid rgba(34, 197, 94, 0.3);
      backdrop-filter: blur(8px);
    }

    .scanlines {
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0),
        rgba(0, 0, 0, 0) 50%,
        rgba(34, 197, 94, 0.05) 50%,
        rgba(34, 197, 94, 0.05)
      );
      background-size: 100% 4px;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #020b05; }
    ::-webkit-scrollbar-thumb { background: #22c55e; border-radius: 99px; }
  </style>
</head>
<body class="text-white overflow-hidden select-none h-screen w-screen bg-black">

  <!-- Background Canvas Engine -->
  <canvas id="cyber-canvas" class="fixed inset-0 z-0 pointer-events-none"></canvas>

  <div 
    x-data="chatApp()" 
    x-init="$watch('messages', () => scrollToBottom()); initSpeechRecognition();"
    class="relative z-10 h-screen flex flex-col justify-between overflow-hidden scanlines"
  >
    <!-- Header -->
    <header class="border-b border-green-500/30 bg-black/80 px-6 py-3.5 flex items-center justify-between backdrop-blur-md">
      <div class="flex items-center space-x-4">
        <div class="relative">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-green-500 to-emerald-200 p-[1px]">
            <div class="w-full h-full bg-black rounded-[11px] flex items-center justify-center">
              <i data-lucide="cpu" class="w-5 h-5 text-green-400"></i>
            </div>
          </div>
        </div>
        
        <div>
          <h1 class="font-extrabold text-white text-base tracking-widest font-tech uppercase flex items-center gap-2">
            CYBER_NODE <span class="text-xs px-2 py-0.5 rounded bg-green-950 border border-green-500 text-green-400">V3.0 // SPEECH_ENABLED</span>
          </h1>
        </div>
      </div>

      <button
        @click="messages = []"
        class="pitch-glass text-xs text-neutral-300 hover:text-green-400 px-4 py-2 rounded-xl transition-all flex items-center gap-2 font-tech"
      >
        <i data-lucide="power" class="w-3.5 h-3.5 text-green-400"></i>
        <span>PURGE</span>
      </button>
    </header>

    <!-- Main Chat Container -->
    <main class="flex-1 overflow-y-auto flex flex-col items-center justify-start p-4 sm:p-6" id="chat-container">
      
      <!-- Landing View -->
      <template x-if="messages.length === 0">
        <div class="my-auto flex flex-col items-center justify-center max-w-3xl text-center px-4">
          <h2 class="text-5xl sm:text-7xl font-black text-white tracking-tight mb-2 font-tech uppercase">
            CYBER
          </h2>
          <p class="text-xs sm:text-sm text-green-400/80 font-tech mb-8 tracking-widest">
            [SYSTEM_POTENTIAL] // ALGORITHMIC_EXECUTION
          </p>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full max-w-2xl text-left">
            <template x-for="(item, index) in suggestionCards" :key="index">
              <button
                @click="sendMessage(item.query)"
                class="pitch-glass p-4 rounded-xl transition-all duration-300 hover:border-green-400 group text-left"
              >
                <p class="text-xs font-bold text-white group-hover:text-green-400 font-tech" x-text="item.title"></p>
                <p class="text-[11px] text-neutral-400 mt-1" x-text="item.desc"></p>
              </button>
            </template>
          </div>
        </div>
      </template>

      <!-- Active Chat Stream -->
      <template x-if="messages.length > 0">
        <div class="w-full max-w-3xl space-y-6 py-4">
          <template x-for="(msg, index) in messages" :key="index">
            <div class="flex items-start gap-4" :class="msg.role === 'user' ? 'flex-row-reverse' : ''">
              <div 
                class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0 border"
                :class="msg.role === 'user' ? 'bg-slate-900 border-white/40 text-white' : 'bg-black border-green-500 text-green-400'"
              >
                <i :data-lucide="msg.role === 'user' ? 'terminal' : 'bot'" class="w-4 h-4"></i>
              </div>

              <div 
                class="max-w-[82%] rounded-xl p-4 text-sm leading-relaxed border font-tech pitch-glass"
                :class="msg.role === 'user' ? 'border-white/20 text-white' : 'border-green-500/40 text-green-100'"
                x-text="msg.content"
              ></div>
            </div>
          </template>
        </div>
      </template>
    </main>

    <!-- Bottom Input Area with Working Web Speech API -->
    <footer class="p-4 relative z-10">
      <div class="max-w-3xl mx-auto">
        <form @submit.prevent="sendMessage()" class="flex items-center pitch-glass rounded-xl p-2 border-green-500/40 gap-2">
          
          <input
            type="text"
            x-model="input"
            :placeholder="isListening ? 'Listening your voice...' : 'Type your command or use mic...'"
            class="w-full bg-transparent border-none text-sm text-white placeholder-neutral-500 focus:outline-none px-3 py-1.5 font-tech"
          />

          <!-- Voice Mic Button -->
          <button
            type="button"
            @click="toggleVoiceRecognition()"
            class="p-2 rounded-lg transition-all flex items-center justify-center shrink-0"
            :class="isListening ? 'bg-red-500/20 text-red-400 border border-red-500 animate-pulse' : 'text-green-400 hover:text-white hover:bg-green-950/60'"
            title="Toggle Voice Input"
          >
            <i data-lucide="mic" class="w-5 h-5"></i>
          </button>

          <!-- Exec Button -->
          <button
            type="submit"
            :disabled="!input.trim()"
            class="bg-green-500 hover:bg-green-400 disabled:opacity-40 text-black font-bold px-4 py-2 rounded-lg transition-all font-tech text-xs shrink-0"
          >
            EXEC
          </button>
        </form>
      </div>
    </footer>
  </div>

  <script>
    // Canvas Engine Setup
    const canvas = document.getElementById('cyber-canvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    let particles = [];
    let matrixCols = [];
    const matrixChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*';
    const fontSize = 14;

    let mouse = { x: width * 0.8, y: height * 0.35 };

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.x;
      mouse.y = e.y;
    });

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      init();
    });

    class CometParticle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.speed = Math.random() * 2 + 1.5;
        this.angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;
        this.length = Math.random() * 16 + 10;
        this.size = Math.random() * 2 + 1.5;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
          this.reset();
        }
      }

      draw() {
        const tailX = this.x - (this.vx * (this.length / this.speed));
        const tailY = this.y - (this.vy * (this.length / this.speed));

        let grad = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
        grad.addColorStop(0, 'rgba(52, 211, 153, 0.9)');
        grad.addColorStop(1, 'rgba(16, 185, 129, 0)');

        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(tailX, tailY);
        ctx.strokeStyle = grad;
        ctx.lineWidth = this.size;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = '#a7f3d0';
        ctx.shadowColor = '#10b981';
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    function init() {
      particles = [];
      const particleCount = Math.floor((width * height) / 18000);
      for (let i = 0; i < particleCount; i++) {
        particles.push(new CometParticle());
      }

      const columns = Math.floor(width / fontSize);
      matrixCols = [];
      for (let i = 0; i < columns; i++) {
        matrixCols[i] = Math.random() * -100;
      }
    }

    function drawGreenMatrixRain() {
      ctx.fillStyle = 'rgba(2, 11, 5, 0.35)';
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = '#00FF66';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < matrixCols.length; i++) {
        const text = matrixChars.charAt(Math.floor(Math.random() * matrixChars.length));
        const x = i * fontSize;
        const y = matrixCols[i] * fontSize;

        ctx.fillText(text, x, y);

        if (y > height && Math.random() > 0.975) {
          matrixCols[i] = 0;
        }
        matrixCols[i]++;
      }
    }

    function drawRadialWhiteNode() {
      const connectRadius = 240;

      particles.forEach(p => {
        let dx = mouse.x - p.x;
        let dy = mouse.y - p.y;
        let dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < connectRadius) {
          let alpha = (1 - dist / connectRadius) * 0.85;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(mouse.x, mouse.y);
          
          let lineGrad = ctx.createLinearGradient(p.x, p.y, mouse.x, mouse.y);
          lineGrad.addColorStop(0, `rgba(52, 211, 153, ${alpha * 0.6})`); 
          lineGrad.addColorStop(1, `rgba(255, 255, 255, ${alpha})`);

          ctx.strokeStyle = lineGrad;
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }
      });

      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 20;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function animate() {
      drawGreenMatrixRain();
      
      particles.forEach(p => {
        p.update();
        p.draw();
      });

      drawRadialWhiteNode();

      requestAnimationFrame(animate);
    }

    init();
    animate();

    // Alpine JS Application Logic
    function chatApp() {
      return {
        input: '',
        messages: [],
        isListening: false,
        recognition: null,
        suggestionCards: [
          { title: 'MATRIX_RAIN', desc: 'Green vertical digital stream', query: 'Explain matrix rain algorithms' },
          { title: 'RADIAL_NODE', desc: 'White center starburst network', query: 'How does graph network visualization work?' },
        ],
        initSpeechRecognition() {
          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (SpeechRecognition) {
            this.recognition = new SpeechRecognition();
            this.recognition.continuous = false;
            this.recognition.interimResults = true;
            this.recognition.lang = 'hi-IN';

            this.recognition.onresult = (event) => {
              const transcript = Array.from(event.results)
                .map(result => result[0].transcript)
                .join('');
              this.input = transcript;
            };

            this.recognition.onend = () => {
              this.isListening = false;
            };

            this.recognition.onerror = (event) => {
              console.error('Speech Recognition Error:', event.error);
              this.isListening = false;
            };
          } else {
            console.warn('Web Speech API is not supported in this browser.');
          }
        },
        toggleVoiceRecognition() {
          if (!this.recognition) {
            alert('Browser speech recognition support nahi karta. Chrome/Edge use karke dekho!');
            return;
          }

          if (this.isListening) {
            this.recognition.stop();
            this.isListening = false;
          } else {
            this.recognition.start();
            this.isListening = true;
          }
        },
        async sendMessage(textToSend) {
          const query = textToSend || this.input;
          if (!query.trim()) return;

          if (this.isListening && this.recognition) {
            this.recognition.stop();
            this.isListening = false;
          }

          this.messages.push({ role: 'user', content: query });
          this.input = '';
          
          const loadingIndex = this.messages.length;
          this.messages.push({ role: 'assistant', content: 'EXECUTING_PYTHON_PIPELINE...' });

          try {
            const response = await fetch('http://127.0.0.1:5000/api/chat', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ prompt: query })
            });

            const data = await response.json();
            this.messages[loadingIndex].content = data.reply;

          } catch (error) {
            console.error('Python API Error:', error);
            this.messages[loadingIndex].content = 'ERROR: Python Flask Server is offline!';
          }

          this.$nextTick(() => lucide.createIcons());
        },
        scrollToBottom() {
          const chatContainer = document.getElementById('chat-container');
          if (chatContainer) chatContainer.scrollTop = chatContainer.scrollHeight;
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
